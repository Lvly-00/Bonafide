services:
  # --- Backend: Laravel API (Docker) ---
  - type: web
    name: bonafide-backend
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO
    branch: main
    rootDir: Bonafide-Backend
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://bonafide-backend.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-winter-thunder-azf09p2e-pooler.c-3.ap-southeast-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_Fji70hqeRGDw
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_LEVEL
        value: warning

  # --- Frontend: React + Vite (Static Site) ---
  - type: web
    name: bonafide-frontend
    runtime: static
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO
    branch: main
    rootDir: Bonafide-Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bonafide-backend.onrender.com/api

